name: WIMS Backend CI

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v6

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Restore dependencies
        run: dotnet restore WIMS.sln

      - name: Build solution
        run: dotnet build WIMS.sln --configuration Release --no-restore

      - name: Run unit tests
        run: dotnet test WIMS.Tests/WIMS.Tests.csproj --configuration Release --no-build --logger "trx;LogFileName=test-results.trx"
