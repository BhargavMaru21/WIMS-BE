name: WIMS Backend CI/CD

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v6

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Restore dependencies
        run: dotnet restore WIMS.sln

      - name: Build solution
        run: dotnet build WIMS.sln --configuration Release --no-restore

      - name: Run unit tests
        run: dotnet test WIMS.Tests/WIMS.Tests.csproj --configuration Release --no-build --logger "trx;LogFileName=test-results.trx"

  build-and-push:
    name: Build, Push and Update GitOps
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: bhargavmaru/wims-api
          tags: |
            type=sha,prefix=sha-,format=long
            type=raw,value=latest

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Checkout GitOps repository
        uses: actions/checkout@v6
        with:
          repository: BhargavMaru21/WIMS-GitOps
          ref: main
          token: ${{ secrets.GITOPS_TOKEN }}
          path: gitops

      - name: Update backend image tag
        env:
          IMAGE_TAG: sha-${{ github.sha }}
        run: |
          cd gitops

          python - <<'PY'
          import os
          import re
          from pathlib import Path

          path = Path("values.yaml")
          content = path.read_text()
          tag = os.environ["IMAGE_TAG"]

          pattern = r'(?ms)(^api:\s*\n.*?^\s+tag:\s*)["\']?[^"\']+["\']?'
          updated, count = re.subn(
              pattern,
              lambda m: m.group(1) + '"' + tag + '"',
              content,
              count=1
          )

          if count != 1:
              raise SystemExit("Could not locate api.image.tag")

          path.write_text(updated)
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add values.yaml

          if ! git diff --cached --quiet; then
            git commit -m "Deploy WIMS API ${IMAGE_TAG}"
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          else
            echo "Backend image tag is already up to date."
          fi
